server {
    listen 80;
    server_name _;

    # LINE Webhook / API
    location /webhook/ {
        proxy_pass         http://webhook-receiver:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # ヘルスチェック
    location /health {
        proxy_pass http://webhook-receiver:3000;
    }

    # プレビューサーバー（生成コードの静的ファイル）
    location /previews/ {
        alias /usr/share/nginx/previews/;
        autoindex off;
        try_files $uri $uri/ =404;
    }
}
